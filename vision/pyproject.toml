[project]
name = "cues-vision"
version = "0.1.0"
description = "Cues local vision service: camera, hand and face tracking, gesture matching, expression context, task events."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "mediapipe>=0.10.14",
    "onnxruntime>=1.18",
    "hsemotion-onnx>=0.3",
    "supabase>=2.5",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# Tests import the package as `vision`, so the repo root must be on the path.
pythonpath = [".."]
testpaths = ["tests"]
markers = [
    "hardware: needs a real camera or downloaded model weights; skipped in CI",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
