name: supabase

# Runs when the database migrations or tests change: replays every migration on a real
# PostgreSQL and runs the SQL tests (supabase/tests), then lints those Python tests.
# No hosted credentials are used; the tests start a throwaway local cluster.
# Don't make this a required status check: PRs that skip it would wait forever.
on:
  pull_request:
    paths:
      - "supabase/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/supabase.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/supabase.yml"

permissions:
  contents: read

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --locked

      # The tests start their own temporary PostgreSQL (initdb, pg_ctl, psql).
      - name: Put PostgreSQL's tools on the path
        run: |
          if ! ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql
          fi
          bin="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/initdb" --version

      - name: Lint
        run: uv run ruff check supabase

      - name: Format check
        run: uv run ruff format --check supabase

      # The tests skip themselves when PostgreSQL is missing. A skipped database test must
      # not count as a pass, so any skip fails this step.
      - name: Database tests
        env:
          USER: runner
        run: |
          set -o pipefail
          uv run pytest supabase -q -rs 2>&1 | tee pytest.log
          if grep -qi "skipped" pytest.log; then
            echo "::error::Database tests were skipped (PostgreSQL tools not found?)"
            exit 1
          fi
