name: vision

# Only runs when vision/shared code, the shared Python environment, the flag registry
# or this file changes.
# Don't make this a required status check: PRs that skip it would wait forever.
on:
  pull_request:
    paths:
      - "vision/**"
      - "shared/**"
      - "flags.json"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/vision.yml"
  push:
    branches: [main]
    paths:
      - "vision/**"
      - "shared/**"
      - "flags.json"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/vision.yml"

permissions:
  contents: read

concurrency:
  group: vision-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --locked

      # OpenCV and MediaPipe need these system libraries on Ubuntu.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Lint
        run: uv run ruff check vision shared

      - name: Format check
        run: uv run ruff format --check vision shared

      - name: Tests (hardware tests skipped)
        run: uv run pytest vision shared/tests
